name=map_tiles_lvgl8
version=2.0.0
author=Eric Nam (original map_tiles); LVGL 8 / Arduino port
maintainer=map_tiles_lvgl8 contributors
sentence=Offline map tiles, smooth map widget, routes and turn-by-turn matching for LVGL 8.x.
paragraph=Arduino / PlatformIO port of the map_tiles ESP-IDF component (LVGL 9) to LVGL 8.3. Loads 256x256 RGB565 tiles from SD / LittleFS on a background task, draws a draggable map view with route, position marker and follow mode, and matches GPS fixes to a route.bin. Developed for ESP32 (PSRAM recommended).
